name: Build Windows Installer

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install pyinstaller flask waitress

    - name: Build CD.exe
      run: pyinstaller --onefile --noconsole src/CD.py

    - name: Build version1.exe
      run: pyinstaller --onefile src/version1.py

    - name: Install Inno Setup
      run: choco install innosetup -y

    - name: Build installer
      run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss'

    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: MonLogiciel_Setup
        path: output/*.exe
